<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Status</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: none; }
  #msg { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin: 8px 0; }
  button { padding: 10px 16px; font-size: 16px; }
  @media (prefers-color-scheme: dark) { html, body { background: #111; color: #ddd; } }
</style>
</head>
<body>
<div id="msg">Loading…</div>
<iframe id="f" title="Status dashboard"></iframe>
<script>
// The token lives only in this browser: it arrives once in the URL fragment (#token, never sent to any server)
// and is kept in localStorage. host.txt holds the current cloudflared address, useless without the token.
(function () {
  var KEY = "status-token", msg = document.getElementById("msg"), f = document.getElementById("f");
  function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function set(t) { try { localStorage.setItem(KEY, t); } catch (e) {} }
  var t = location.hash.slice(1);
  if (t) { set(t); history.replaceState(null, "", location.pathname); } else { t = get(); }
  if (!t) {
    msg.innerHTML = '<p>Enter the dashboard token.</p><input id="t" type="password" autocomplete="off">' +
      '<button id="b">Open</button>';
    document.getElementById("b").onclick = function () {
      var v = document.getElementById("t").value.trim();
      if (v) { set(v); location.reload(); }
    };
    return;
  }
  fetch("host.txt?" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (h) {
    h = h.trim();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(h)) throw new Error("bad host");
    f.src = h + "/" + encodeURIComponent(t) + "/";
    f.style.display = "block";
    msg.style.display = "none";
  }).catch(function () { msg.textContent = "Dashboard address not available."; });
})();
</script>
</body>
</html>
